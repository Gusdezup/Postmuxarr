name: Release

# Un tag vX.Y.Z (créé par scripts/release.sh) : image Docker publiée sur GHCR, puis GitHub Release
# dont les notes sont la section correspondante de CHANGELOG.md.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/gusdezup/postmuxarr

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Contrôles (tag, app/VERSION, CHANGELOG.md)
        id: v
        run: |
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          file="$(tr -d '[:space:]' < app/VERSION)"
          if [ "$ver" != "$file" ]; then
            echo "::error::Tag $tag mais app/VERSION contient $file"; exit 1
          fi
          awk -v v="$ver" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::Pas de section [$ver] dans CHANGELOG.md"; exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Métadonnées de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      # amd64 seulement : le binaire go-bdinfo du Dockerfile est amd64
      - name: Build et publication
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: notes.md
          generate_release_notes: true   # ajoute le lien « Full Changelog » sous les notes
