# Service postmuxarr, à placer dans le docker-compose.yml du stack (chemins relatifs au dossier du stack).
# Clés et mots de passe : de préférence dans l'onglet Réglages. Les variables ci-dessous (fichier .env du stack)
# restent acceptées en repli et peuvent être omises.
services:
  postmuxarr:
    build: ./postmuxarr
    image: postmuxarr
    container_name: postmuxarr
    user: "1026:100"                      # utilisateur:groupe propriétaires des médias (id -u ; id -g)
    environment:
      - TZ=Europe/Paris
      - SOURCE_ROOT=/volume1/media/downloads   # sources des remux
      - OUTPUT_DIR=/volume1/media/remux        # remux produits
      - PLEX_DIR=/volume1/media/films          # bibliothèque (hardlinks)
      - QBT_API_KEY=${QBT_API_KEY:-}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - HDF_API_KEY=${HDF_API_KEY:-}
      - NETTOYARR_USER=${NETTOYARR_USER:-}
      - NETTOYARR_PASS=${NETTOYARR_PASS:-}
    volumes:
      - type: bind                          # un seul montage : indispensable pour les hardlinks
        source: /volume1/media
        target: /volume1/media
        bind:
          propagation: rslave               # ISO montés par l'hôte visibles sans redémarrer
      - ./postmuxarr-data:/data             # base de l'app : jobs, réglages, rapports BDInfo
      - ./postmuxarr/config.yml:/app/config.yml:ro
    ports:
      - "8790:8790"
    labels:
      - com.centurylinklabs.watchtower.enable=false   # image locale : Watchtower ne doit pas tenter de la tirer
    restart: unless-stopped
